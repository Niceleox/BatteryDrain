<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05070a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Drain">
    <title>Battery Drain</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>

    <main class="panel" aria-label="Battery drain controls">
      <section class="readout" aria-live="polite">
        <div class="label">Runtime</div>
        <div id="runtime" class="time">00:00</div>
        <div id="status" class="status">Ready</div>
      </section>

      <section class="metrics" aria-label="Current load">
        <div class="metric">
          <span>FPS</span>
          <strong id="fps">120 target</strong>
        </div>
        <div class="metric">
          <span>CPU</span>
          <strong id="cpu">3 workers</strong>
        </div>
        <div class="metric">
          <span>Wake</span>
          <strong id="wake">idle</strong>
        </div>
      </section>

      <section class="controls" aria-label="Actions">
        <button id="toggle" class="primary" type="button">
          <span id="toggleIcon">▶</span>
          <span id="toggleText">Start</span>
        </button>
        <button id="boost" class="secondary" type="button" aria-pressed="false">
          <span>CPU+</span>
        </button>
      </section>

      <p class="note">
        Keep this page open in Safari. If the screen still dims, set Auto-Lock to Never while using it.
      </p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
